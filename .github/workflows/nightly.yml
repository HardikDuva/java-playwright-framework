name: Nightly regression

on:
  schedule:
    - cron: '0 2 * * *'   # 02:00 UTC daily
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Cross-browser fan-out. Add a `shard` axis here once a TestNG
        # method-interceptor shard splitter is introduced.
        browser: [ chromium, firefox, webkit ]
    env:
      ADMIN_LOGIN_PASSWORD: ${{ secrets.ADMIN_LOGIN_PASSWORD || 'welcome01' }}
      USER_LOGIN_PASSWORD:  ${{ secrets.USER_LOGIN_PASSWORD || 'welcome01' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compile
        run: mvn -B clean test-compile

      - name: Install Playwright browsers
        run: mvn -B exec:java -Dexec.args="install --with-deps ${{ matrix.browser }}"

      - name: Run regression (${{ matrix.browser }})
        run: >
          mvn -B test
          -DsuiteXmlFile=src/test/resources/suites/regression.xml
          -Dbrowser.name=${{ matrix.browser }}
          -Dbrowser.headless=true
          -DtestFailureIgnore=false

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.browser }}
          path: target/allure-results
          retention-days: 14

      - name: Upload traces (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: traces-${{ matrix.browser }}
          path: target/traces
          retention-days: 14
