# ---------------------------------------------------------------------------
# Base configuration. Any value here can be overridden (highest wins) by:
#   1. -Dkey=value        (JVM system property)
#   2. ENV VAR            (key upper-cased, dots -> underscores, e.g. BASE_URL)
#   3. config-<env>.properties  (selected with -Denv=<name>)
# Secrets (passwords) should come from 1 or 2 in CI, never from this file.
# The credentials below are the *public* demo accounts for the demo site.
# ---------------------------------------------------------------------------

BASE_URL=https://practicesoftwaretesting.com
API_BASE_URL=https://api.practicesoftwaretesting.com
REMOTE_PROVIDER=local

# Local browser engine: chromium | firefox | webkit
browser.name=chromium
browser.headless=true

# Timeouts (ms)
visibility.wait.timeout=10000
navigation.wait.timeout=30000

# Diagnostics
trace.enabled=true
video.on.failure=false

# Public demo credentials — override in CI via env vars
# (USER_LOGIN_PASSWORD / ADMIN_LOGIN_PASSWORD, etc.)
user.login.email=customer2@practicesoftwaretesting.com
user.login.password=welcome01

admin.login.email=admin@practicesoftwaretesting.com
admin.login.password=welcome01
